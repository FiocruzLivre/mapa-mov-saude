# Regras exclusivas do MapaMovSaúde: artigos em /$1.
# Montar como /etc/apache2/conf-enabled/mapamov-short-urls.conf.
<IfModule !mod_rewrite.c>
    LoadModule rewrite_module /usr/lib/apache2/modules/mod_rewrite.so
</IfModule>

<Directory "/var/www/mediawiki">
    Options +FollowSymLinks
    RewriteEngine On

    # Só redirecionar leitura direta, sem query string nem corpo HTTP.
    # Links com action, oldid, diff, e requisições POST continuam intactos.
    RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
    RewriteCond %{QUERY_STRING} ^$
    RewriteCond %{THE_REQUEST} \s/+index\.php/
    RewriteRule ^index\.php/(.+)$ /$1 [R=302,L,NE]

    # Scripts MediaWiki e recursos não são artigos.
    RewriteRule ^(index|api|load|rest|img_auth|thumb|thumb_handler|opensearch_desc)\.php(/|$) - [END]
    RewriteRule ^(images|resources|extensions|skins|vendor|cache|languages|docs|tests|sql|maintenance|mw-config|includes)(/|$) - [END]

    # MediaWiki resolve o título a partir de REQUEST_URI, sem ?title=.
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^.+$ /index.php [END]
</Directory>
